# Svaki push na main izgradi demo i objavi ga na https://tsimunic.github.io/ma-no/
# Jednokratno na GitHubu: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Samo jedna objava u isto vrijeme; novi push prekida stariju objavu u tijeku
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bez "cache: npm" i "npm ci": web nema ovisnosti ni package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Build za podadresu /ma-no/ s noindex na svim stranicama, u mapu dist-demo/ (vidi TARGETS u build.mjs)
      - run: npm run build:demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
